<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Chat • Home</title>
	<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
	<header class="app-header">
		<h2>Chat</h2>
		<div class="actions">
			<a id="notif-link" href="/notifications.html" title="Notifications">🔔</a>
			<button id="logout">Logout</button>
		</div>
	</header>
	<div class="app-container">
		<aside class="sidebar">
			<input id="search-email" type="email" placeholder="Add friend by email" />
			<div id="search-result"></div>
			<h3>Friends</h3>
			<ul id="friends"></ul>
		</aside>
		<main class="chat">
			<div id="empty-state">Select a friend to start chatting</div>
			<div id="chat-panel" class="hidden">
				<div class="chat-header">
					<span id="chat-peer"></span>
					<div>
						<button id="btn-call">Call</button>
					</div>
				</div>
				<div id="messages" class="messages"></div>
				<form id="message-form" class="message-form">
					<input id="message-input" placeholder="Type a message" />
					<input id="image-file" type="file" accept="image/*" />
					<button type="submit">Send</button>
				</form>
				<div class="call-area">
					<video id="localVideo" autoplay muted playsinline></video>
					<video id="remoteVideo" autoplay playsinline></video>
				</div>
			</div>
		</main>
	</div>
	<div id="incoming-call" class="incoming hidden">
		<div class="card">
			<p>Incoming call…</p>
			<div class="buttons">
				<button id="accept-call" class="green">Join</button>
				<button id="decline-call" class="red">Decline</button>
			</div>
		</div>
	</div>
	<script src="/socket.io/socket.io.js"></script>
	<script src="/js/app.js"></script>
</body>
</html>
